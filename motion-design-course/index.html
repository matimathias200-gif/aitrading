<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Motion IA</title>
<meta name="description" content="Réponds à quelques questions et reçois ton plan Motion IA personnalisé pour créer des animations pro avec l'intelligence artificielle." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* Layout: app-like quiz funnel — one question per screen in a centred column, progress bar on top, ends on a personalised plan and checkout */
:root {
  --bg: #0e1030;
  --bg-2: #15183f;
  --surface: #1c2050;
  --line: #2e3370;
  --fg: #f3f1ff;
  --muted: #a7a9d6;
  --accent: #ff4f8b;
  --accent-ink: #1a0614;
  --cyan: #4fe0ff;
  --gold: #ffd166;
  --ok: #3ddc97;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f5ff; --bg-2: #ecebfb; --surface: #ffffff; --line: #d9d8f0;
    --fg: #14163a; --muted: #5a5c85; --accent: #e0306f; --accent-ink: #ffffff;
    --cyan: #0a8fb3; --gold: #b07a00; --ok: #138a5a; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f5ff; --bg-2: #ecebfb; --surface: #ffffff; --line: #d9d8f0;
  --fg: #14163a; --muted: #5a5c85; --accent: #e0306f; --accent-ink: #ffffff;
  --cyan: #0a8fb3; --gold: #b07a00; --ok: #138a5a; color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  overflow-x: hidden; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h1 { font-size: clamp(1.9rem, 6vw, 2.9rem); font-weight: 800; }
h2 { font-size: clamp(1.4rem, 4.6vw, 1.9rem); font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }
.muted { color: var(--muted); }
.hl { color: var(--accent); }
.tc { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .08em; color: var(--cyan); text-transform: uppercase; display: inline-flex; gap: 10px; align-items: center; }
.tc::before { content: ""; width: 8px; height: 8px; background: var(--cyan); transform: rotate(45deg); flex: none; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 640px; margin: 0 auto; padding: 0 16px; height: 60px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.back { grid-column: 1; grid-row: 1; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 1.1rem; }
.logo { grid-column: 2; grid-row: 1; justify-self: center; font-family: var(--font-display); font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.logo b { color: var(--accent); }
.progress { height: 4px; background: var(--bg-2); }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .4s cubic-bezier(.2,.8,.2,1); }

/* Screen */
main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 28px 16px 130px; }
.screen { display: grid; gap: 22px; animation: enter .35s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: .3; transform: translateY(14px); } }
.q-head { display: grid; gap: 10px; }
.q-head p { color: var(--muted); }
.step-count { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* Options */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left;
  width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  cursor: pointer; transition: border-color .15s, transform .1s, background .15s;
}
.opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.opt:active { transform: scale(.98); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.opt .ic { font-size: 1.5rem; width: 34px; text-align: center; }
.opt b { display: block; font-weight: 700; }
.opt small { display: block; color: var(--muted); font-size: .86rem; }
.opt .tick { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: var(--accent-ink); }
.opt.radio .tick { border-radius: 50%; }
.opt[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); }
.opts.two .opt { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 18px 10px; gap: 6px; }
.opts.two .opt .tick { display: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer;
  font: 800 1.02rem var(--font-body); background: var(--accent); color: var(--accent-ink);
  border: 2px solid var(--accent); padding: 16px 24px; border-radius: 14px; width: 100%;
  transition: transform .15s, box-shadow .15s, opacity .15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.cta-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.cta-bar > div { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.cta-bar small { text-align: center; color: var(--muted); font-size: .8rem; }

/* Intro */
.intro .lead { font-size: 1.1rem; color: var(--muted); }
.intro .lead b { color: var(--fg); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li::before { content: "✓  "; color: var(--ok); font-weight: 800; }

.editor { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.editor-top { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.editor-prompt { padding: 12px 14px; font-family: var(--font-mono); font-size: .82rem; min-height: 62px; border-bottom: 1px solid var(--line); }
.editor-prompt .who { color: var(--accent); }
.caret { color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stage { position: relative; height: 150px; overflow: hidden; }
.stage .ball { position: absolute; left: 8%; bottom: 22px; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); animation: travel 2.6s cubic-bezier(.68,-0.55,.27,1.55) infinite alternate; }
.stage .word { position: absolute; top: 26px; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .18em; animation: word 2.6s cubic-bezier(.2,.8,.2,1) infinite alternate; }
.stage .ground { position: absolute; left: 6%; right: 6%; bottom: 21px; height: 1px; background: var(--line); }
@keyframes travel { to { left: calc(92% - 38px); transform: rotate(360deg); } }
@keyframes word { 0% { opacity: .1; letter-spacing: .5em; } 60%, 100% { opacity: 1; letter-spacing: .18em; } }
.timeline { position: relative; padding: 10px 14px 12px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.track { position: relative; height: 7px; border-radius: 4px; background: var(--surface); }
.kf { position: absolute; top: 50%; width: 8px; height: 8px; background: var(--gold); transform: translate(-50%,-50%) rotate(45deg); }
.playhead { position: absolute; top: 4px; bottom: 6px; left: 14px; width: 2px; background: var(--accent); animation: play 2.6s linear infinite alternate; }
@keyframes play { to { left: calc(100% - 14px); } }

/* Info screens */
.info-card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; }
.big-num { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; color: var(--accent); line-height: 1; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare > div { border-radius: 12px; padding: 14px; border: 1px solid var(--line); display: grid; gap: 4px; }
.compare .now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.compare span { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-transform: uppercase; }
.compare b { font-family: var(--font-display); font-size: 1.3rem; }

/* Lead form */
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .92rem; }
.field input { width: 100%; padding: 15px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); font: 500 1rem var(--font-body); }
.field input:focus { outline: none; border-color: var(--accent); }
.field .err { color: var(--accent); font-size: .85rem; }
.consent { font-size: .82rem; color: var(--muted); }

/* Loading */
.loader { justify-items: center; text-align: center; padding-top: 30px; }
.ring { width: 140px; height: 140px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.load-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; text-align: left; width: 100%; max-width: 340px; }
.load-list li { color: var(--muted); display: flex; gap: 10px; align-items: center; transition: color .3s; }
.load-list li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.load-list li.done { color: var(--fg); }
.load-list li.done::before { background: var(--ok); border-color: var(--ok); }

/* Result */
.profile { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.profile > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.profile span { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.profile b { overflow-wrap: anywhere; }
.first { border: 2px solid var(--accent); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.first .vis { height: 140px; }
.first > div:last-child { padding: 18px; display: grid; gap: 8px; }
.date-pill { justify-self: start; font-family: var(--font-mono); font-size: .8rem; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.path { list-style: none; margin: 0; padding: 0; display: grid; }
.path li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding-bottom: 18px; position: relative; }
.path li::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 4px; width: 2px; background: var(--line); }
.path li:last-child::after { display: none; }
.path .n { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-2); border: 2px solid var(--cyan); display: grid; place-items: center; font-family: var(--font-mono); font-size: .8rem; color: var(--cyan); }
.path b { display: block; }
.path small { color: var(--muted); font-size: .9rem; }
.callout { border-left: 3px solid var(--gold); padding: 4px 0 4px 16px; display: grid; gap: 4px; }
.callout span { font-family: var(--font-mono); font-size: .75rem; color: var(--gold); text-transform: uppercase; }

/* Project visuals */
.vis { background: var(--bg-2); display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
.v-logo i { width: 54px; height: 54px; border: 4px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin 1.4s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.v-type i { width: 12px; height: 48px; border-radius: 3px; background: var(--cyan); animation: eq .9s ease-in-out infinite alternate; }
.v-type i:nth-child(2) { animation-delay: .15s; background: var(--accent); } .v-type i:nth-child(3) { animation-delay: .3s; background: var(--gold); }
@keyframes eq { to { transform: scaleY(.3); } }
.v-slide i { width: 38px; height: 38px; background: var(--gold); border-radius: 8px; animation: slide 1.8s cubic-bezier(.7,0,.3,1) infinite alternate; }
@keyframes slide { from { transform: translateX(-70px); } to { transform: translateX(70px) rotate(180deg); border-radius: 50%; } }
.v-phone i { width: 40px; height: 72px; border: 2px solid var(--accent); border-radius: 9px; animation: bob 2s ease-in-out infinite; }
.v-phone i:nth-child(2) { animation-delay: -1s; border-color: var(--cyan); }
@keyframes bob { 50% { transform: translateY(-12px); } }
.v-btn i { width: 86px; height: 34px; border-radius: 999px; background: var(--accent); animation: press 1.4s ease-in-out infinite; }
@keyframes press { 40% { transform: scale(.88); } 60% { transform: scale(1.06); } }
.v-data { align-items: flex-end; padding-bottom: 20px; }
.v-data i { width: 20px; background: var(--cyan); border-radius: 3px 3px 0 0; animation: grow 2.4s cubic-bezier(.7,0,.3,1) infinite; }
.v-data i:nth-child(1) { --h: 36px; } .v-data i:nth-child(2) { --h: 66px; background: var(--accent); animation-delay: .1s; }
.v-data i:nth-child(3) { --h: 50px; background: var(--gold); animation-delay: .2s; } .v-data i:nth-child(4) { --h: 86px; animation-delay: .3s; }
@keyframes grow { 0% { height: 6px; } 40%, 80% { height: var(--h); } 100% { height: 6px; } }

/* Checkout */
.deadline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .92rem; }
.deadline .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plans { display: grid; gap: 14px; }
.plan { position: relative; text-align: left; width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 18px; cursor: pointer; display: grid; gap: 10px; }
.plan[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.plan-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.plan .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.plan[aria-pressed="true"] .tick { border: 7px solid var(--accent); }
.plan .pr { text-align: right; }
.plan .pr b { font-family: var(--font-display); font-size: 1.35rem; display: block; font-variant-numeric: tabular-nums; }
.plan .pr s { color: var(--muted); font-family: var(--font-mono); font-size: .82rem; }
.plan .pr small { display: block; color: var(--muted); font-size: .78rem; }
.plan ul { list-style: none; margin: 0; padding: 0 0 0 34px; display: grid; gap: 5px; font-size: .92rem; color: var(--muted); }
.plan li::before { content: "✓  "; color: var(--ok); font-weight: 800; }
.plan:not([aria-pressed="true"]) ul { display: none; }
.badge { position: absolute; top: -11px; right: 16px; background: var(--gold); color: var(--bg); font-weight: 800; font-size: .7rem; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
.methods { display: grid; gap: 10px; }
.label { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.logos { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
.pm { display: inline-flex; align-items: center; justify-content: center; height: 24px; min-width: 38px; padding: 0 6px; border-radius: 5px; background: #ffffff; color: #1a1a1a; font: 800 .66rem var(--font-body); border: 1px solid #d9d8f0; }
.pm.visa { color: #1a1f71; font-style: italic; }
.pm.pp { color: #003087; } .pm.pp b { color: #009cde; }
.pm.cb { background: #1c5c9a; color: #ffffff; border-color: #1c5c9a; }
.pm.mc i { width: 12px; height: 12px; border-radius: 50%; background: #eb001b; } .pm.mc i + i { background: #f79e1b; margin-left: -5px; }
.notice { font-size: .9rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); }
.guarantee { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; border: 1px dashed var(--ok); border-radius: var(--radius); padding: 16px; }
.seal { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ok); display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 800; color: var(--ok); font-size: .6rem; line-height: 1.1; }
.seal b { font-size: 1.2rem; display: block; }
.guarantee p { color: var(--muted); font-size: .9rem; }
.restart { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; justify-self: center; }

footer { border-top: 1px solid var(--line); padding: 20px 16px 120px; font-size: .82rem; color: var(--muted); text-align: center; }

@media (max-width: 420px) {
  .profile { grid-template-columns: 1fr; }
  .opt { padding: 14px 12px; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <button class="back" id="back" aria-label="Question précédente" hidden>←</button>
    <span class="logo">
      <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 24 C 10 24, 10 4, 25 4" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="4" r="3" fill="var(--cyan)"/></svg>
      Motion <b>IA</b>
    </span>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>

<main id="app" aria-live="polite"></main>

<div class="cta-bar" id="cta-bar" hidden>
  <div><button class="btn" id="cta"></button><small id="cta-note" hidden></small></div>
</div>

<footer>© <span id="year">2026</span> Motion IA · Mentions légales · CGV · Contact</footer>

<script>
/* ===================== CONFIGURATION ===================== */
/* Liens de paiement par formule.
   card   : Stripe Payment Link paiement unique (CB, Apple Pay, Google Pay)
   split  : Stripe Payment Link en 3 mensualités
   paypal : lien PayPal                                                       */
const PAYMENT_LINKS = {

  coaching:  { card: "", split: "", paypal: "" },
};
/* URL qui reçoit les réponses + e-mail (Systeme.io, Brevo, Make, Zapier...). Vide = désactivé. */
const LEAD_WEBHOOK_URL = "";
/* Fin de l'offre de lancement. Après cette date, les prix barrés disparaissent. */
const LAUNCH_OFFER_END = "2026-10-31T23:59:59";

const PLANS = {
  essentiel: { name: "Essentiel", price: 97, old: 147 },
  pro:       { name: "Pro", price: 197, old: 297 },
  coaching:  { name: "Coaching", price: 497, old: 697 },
};

/* ===================== CONTENU DU QUIZ ===================== */
const O = {
  goal: [
    { v: "freelance", ic: "💼", l: "Devenir motion designer freelance", s: "Vendre mes animations à des clients" },
    { v: "social", ic: "📱", l: "Créer du contenu pour mes réseaux", s: "Reels, TikTok, YouTube" },
    { v: "brand", ic: "🏢", l: "Animer pour mon entreprise", s: "Pubs, présentations, site web" },
    { v: "editing", ic: "🎬", l: "Améliorer mes montages vidéo", s: "Titres, transitions, habillage" },
    { v: "passion", ic: "✨", l: "Apprendre par passion", s: "Pour le plaisir de créer" },
  ],
  create: [
    { v: "logo", ic: "🔷", l: "Logos animés" },
    { v: "social", ic: "📲", l: "Reels / TikTok / Shorts" },
    { v: "ads", ic: "📣", l: "Publicités vidéo" },
    { v: "explainer", ic: "💡", l: "Vidéos explicatives" },
    { v: "type", ic: "🔤", l: "Texte animé" },
    { v: "youtube", ic: "▶️", l: "Intros YouTube" },
    { v: "web", ic: "🖱️", l: "Animations de sites et d'apps" },
    { v: "data", ic: "📊", l: "Graphiques animés" },
  ],
  level: [

const KEY = "motionia-funnel-v1";
const fresh = () => ({ i: 0, a: {}, plan: null, pay: "card" });
let S = fresh();
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.a) S = Object.assign(S, saved); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function steps() { return STEPS.filter((s) => !s.when || s.when(S.a)); }
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => n.toLocaleString("fr-FR", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " €";
const third = (n) => Math.round(n / 3 * 100) / 100;
const offerOn = () => new Date(LAUNCH_OFFER_END).getTime() > Date.now();
const priceOf = (k) => (offerOn() ? PLANS[k].price : PLANS[k].old);

const app = document.getElementById("app");

const ctaBar = document.getElementById("cta-bar");
const cta = document.getElementById("cta");
const ctaNote = document.getElementById("cta-note");
let ctaAction = null, timers = [];

function setCta(label, action, opts = {}) {
  ctaBar.hidden = !label;
  cta.textContent = label || "";
  cta.disabled = !!opts.disabled;
  ctaAction = action;
  ctaNote.hidden = !opts.note;
  ctaNote.textContent = opts.note || "";
}
cta.addEventListener("click", () => ctaAction && !cta.disabled && ctaAction());

function go(delta) {
  const list = steps();
  S.i = Math.max(0, Math.min(list.length - 1, S.i + delta));
  if (delta < 0 && list[S.i].type === "loading") S.i--;
  save(); render();
  window.scrollTo(0, 0);
}
backBtn.addEventListener("click", () => go(-1));

/* ===================== PERSONNALISATION ===================== */
function plan() {
  const a = S.a, create = a.create || [], tools = a.tools || [];
  const hasAE = tools.includes("ae");
  const mods = [];
  if (a.level === "zero" || a.level === "basics")
    mods.push({ t: "Les bases du motion design", s: "Timing, easing et rythme : les réflexes qui rendent une animation pro." });
  mods.push({ t: "Piloter l'IA comme un animateur", s: a.ai === "never" ? "On part de zéro : ta première demande à l'IA, puis comment corriger le résultat." : "Des demandes précises qui donnent le bon résultat du premier coup." });
  if (hasAE || a.level === "inter" || a.level === "pro")
    mods.push({ t: "After Effects + IA : expressions et scripts", s: "L'IA écrit les expressions et automatise tes compositions." });
  if (!hasAE || a.blocker === "soft" || create.some((c) => ["social", "type", "data"].includes(c)))
    mods.push({ t: "Animer sans logiciel payant", s: "Tes vidéos générées par l'IA et exportées en MP4 avec des outils gratuits." });
  if (create.includes("web")) mods.push({ t: "Animations web et apps", s: "Micro-interactions et logos animés prêts à intégrer." });
  if (create.some((c) => ["social", "ads", "youtube"].includes(c)) || a.goal === "social")
    mods.push({ t: "Formats réseaux en automatique", s: "Une animation déclinée en 9:16, 1:1 et 16:9 avec sous-titres." });
  if (create.some((c) => ["explainer", "ads"].includes(c)) || a.blocker === "ideas")
    mods.push({ t: "Du script au rendu final", s: "L'IA t'aide à trouver l'idée, écrire le script et faire le storyboard." });
  if (a.goal === "freelance" || a.goal === "brand" || a.blocker === "clients")
    mods.push({ t: "Trouver et signer des clients", s: "Portfolio, offre, prix et messages de prospection rédigés avec l'IA." });

  const firstKey = [...create].sort((x, y) => PROJECTS[x].n - PROJECTS[y].n)[0] || "logo";
  let days = { 15: 21, 30: 14, 60: 10, 120: 7 }[a.time] || 14;
  if (a.level === "inter" || a.level === "pro") days = Math.max(3, Math.round(days / 2));
  const date = new Date(Date.now() + days * 864e5).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

  let rec = "pro";
  if (a.goal === "freelance" && (a.income >= 3000 || a.blocker === "clients")) rec = "coaching";
  else if (a.goal === "passion" && a.blocker === "soft") rec = "essentiel";

  const fix = {
    time: `Ton plan est calé sur ${LABEL("time", a.time)} par jour, avec des leçons de 10 à 15 minutes.`,
    tech: "Tu n'écris jamais de code toi-même : tu décris ce que tu veux, l'IA le produit, tu ajustes.",
    ideas: "Tu reçois une bibliothèque de 150+ idées et demandes prêtes à l'emploi, classées par type de projet.",
    clients: "Un module complet pour construire ton offre, ton portfolio et tes messages de prospection.",
    soft: "Une grande partie de ton parcours n'utilise que des outils gratuits.",
  }[a.blocker] || "";

  return { mods, first: PROJECTS[firstKey], date, rec, fix };
}

/* ===================== RENDU ===================== */
function optionsHTML(step) {
  const multi = step.type === "multi";
  const val = S.a[step.id];
  return `<div class="opts ${step.two ? "two" : ""}" role="group">` +
    O[step.id].map((o) => {
      const on = multi ? (val || []).includes(o.v) : val === o.v;
      return `<button class="opt ${multi ? "" : "radio"}" data-v="${o.v}" aria-pressed="${on}">
        <span class="ic" aria-hidden="true">${o.ic}</span>
        <span><b>${o.l}</b>${o.s ? `<small>${o.s}</small>` : ""}</span>
        <span class="tick" aria-hidden="true">${multi && on ? "✓" : ""}</span></button>`;
    }).join("") + `</div>`;
}

function render() {
  timers.forEach(clearTimeout); timers = [];
  const list = steps();
  if (S.i >= list.length) S.i = list.length - 1;
  if (list[S.i].type === "loading" && !S.a.email) S.i--;
  const step = list[S.i];
  const qs = list.filter((s) => ["single", "multi", "lead"].includes(s.type));
  const qIndex = qs.indexOf(step);
  const doneQ = list.slice(0, S.i).filter((s) => qs.includes(s)).length;
  bar.style.width = (step.type === "intro" ? 0 : Math.min(100, Math.round((doneQ / qs.length) * 100) + 4)) + "%";
  backBtn.hidden = S.i === 0 || step.type === "loading";
  setCta(null);
  RENDER[step.type](step, qIndex, qs.length);
}

    if (!S.plan) S.plan = P.rec;
    const creates = (a.create || []).map((c) => LABEL("create", c).toLowerCase());
    const INC = {
      essentiel: ["Ton parcours de " + P.mods.length + " étapes en vidéo", "150+ demandes prêtes à l'emploi", "Les fichiers de tous les projets", "Accès à vie et mises à jour"],
      pro: ["Tout Essentiel", "Templates : " + (creates.slice(0, 3).join(", ") || "réseaux sociaux"), "Communauté privée d'entraide", "Module « Trouver des clients »", "Certificat de fin de formation"],
      coaching: ["Tout Pro", "3 sessions de coaching individuel", "Revue de ton portfolio", "Support prioritaire"],
    };
    const on = offerOn();
    const plansHTML = Object.keys(PLANS).map((k) => {
      const p = PLANS[k], price = priceOf(k);
      return `<button class="plan" data-plan="${k}" aria-pressed="${S.plan === k}">
        ${k === P.rec ? `<span class="badge">Recommandé pour toi</span>` : ""}
        <span class="plan-top"><span class="tick" aria-hidden="true"></span><h3>${p.name}</h3>
          <span class="pr">${on ? `<s>${eur(p.old)}</s>` : ""}<b>${eur(price)}</b><small>ou 3 × ${eur(third(price))}</small></span></span>
        <ul>${INC[k].map((x) => `<li>${esc(x)}</li>`).join("")}</ul></button>`;
    }).join("");
    const methods = [
      { v: "card", ic: "💳", l: "Carte bancaire", s: "Apple Pay et Google Pay acceptés", logos: `<span class="pm cb">CB</span><span class="pm visa">VISA</span><span class="pm mc"><i></i><i></i></span>` },
      { v: "split", ic: "🗓️", l: "3× sans frais", s: "Par carte, sur 3 mois", logos: `<span class="pm cb">3×</span>` },
      { v: "paypal", ic: "🅿️", l: "PayPal", s: "Avec ton compte ou en 4× PayPal", logos: `<span class="pm pp"><b>Pay</b>Pal</span>` },
    ];

    app.innerHTML = `<div class="screen">
      ${on ? `<div class="deadline"><span>Offre de lancement</span><span class="mono" id="cd">—</span></div>` : ""}
      <div class="q-head"><h2>${esc(a.name ? a.name + ", choisis" : "Choisis")} ta formule</h2>
        <p>Ton parcours personnalisé est inclus dans les trois formules.</p></div>
      <div class="plans">${plansHTML}</div>
      <div class="methods" role="group" aria-label="Moyen de paiement"><span class="label">Moyen de paiement</span>
        ${methods.map((m) => `<button class="opt radio" data-pay="${m.v}" aria-pressed="${S.pay === m.v}">
          <span class="ic" aria-hidden="true">${m.ic}</span><span><b>${m.l}</b><small>${m.s}</small></span><span class="logos">${m.logos}</span></button>`).join("")}
      </div>
      <p class="notice" id="notice" hidden>Ce moyen de paiement n'est pas encore activé. Le propriétaire du site doit ajouter son lien de paiement dans la configuration.</p>
      <div class="guarantee"><div class="seal"><span><b>14</b>JOURS</span></div>
        <div><h3>Satisfait ou remboursé</h3><p>Si la formation ne te convient pas, tu es remboursé intégralement sous 14 jours, sans justification.</p></div></div>
      <p class="muted" style="font-size:.85rem;text-align:center">🔒 Paiement sécurisé par notre prestataire. Tes données bancaires ne passent jamais par ce site. Accès envoyé par e-mail juste après le paiement.</p>
      <button class="restart" id="restart">Refaire le quiz</button>
    </div>`;

    const update = () => {
      app.querySelectorAll(".plan").forEach((b) => b.setAttribute("aria-pressed", b.dataset.plan === S.plan));
      app.querySelectorAll("[data-pay]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pay === S.pay));
      const price = priceOf(S.plan);
      const label = S.pay === "split" ? `Payer 3 × ${eur(third(price))}` : S.pay === "paypal" ? `Payer ${eur(price)} avec PayPal` : `Payer ${eur(price)}`;
      setCta(label + " →", pay, { note: `Formule ${PLANS[S.plan].name} · accès immédiat` });
      document.getElementById("notice").hidden = true;
      save();
    };
    app.querySelectorAll(".plan").forEach((b) => b.addEventListener("click", () => { S.plan = b.dataset.plan; update(); }));
    app.querySelectorAll("[data-pay]").forEach((b) => b.addEventListener("click", () => { S.pay = b.dataset.pay; update(); }));
    document.getElementById("restart").addEventListener("click", () => { S = fresh(); save(); render(); window.scrollTo(0, 0); });
    update();
    if (on) countdown();
  },
};

function pay() {
  let url = (PAYMENT_LINKS[S.plan] || {})[S.pay];
  if (!url) { const n = document.getElementById("notice"); n.hidden = false; n.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
  if (/stripe\.com/.test(url) && S.a.email) url += (url.includes("?") ? "&" : "?") + "prefilled_email=" + encodeURIComponent(S.a.email);
  window.location.href = url;
}

function countdown() {
  const el = document.getElementById("cd"), end = new Date(LAUNCH_OFFER_END).getTime();
  const tick = () => {
    if (!document.body.contains(el)) return;
    const d = end - Date.now();
    if (d <= 0) { render(); return; }
    const j = Math.floor(d / 864e5), h = Math.floor(d / 36e5) % 24, m = Math.floor(d / 6e4) % 60, s = Math.floor(d / 1e3) % 60;
    el.textContent = `${j}j ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    timers.push(setTimeout(tick, 1000));
  };
  tick();
}

function typeLoop() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const prompts = ["Fais rebondir mon logo avec un effet élastique", "Crée une intro de 5 s avec mon texte animé", "Décline cette animation en format Reel", "Anime ce graphique barre par barre"];
  let pi = 0, ci = prompts[0].length, del = false;
  const loop = () => {
    const el = document.getElementById("typed"); if (!el) return;
    const t = prompts[pi]; el.textContent = t.slice(0, ci);
    if (!del && ci < t.length) { ci++; timers.push(setTimeout(loop, 45)); }
    else if (!del) { del = true; timers.push(setTimeout(loop, 1800)); }
    else if (ci > 0) { ci--; timers.push(setTimeout(loop, 18)); }
    else { del = false; pi = (pi + 1) % prompts.length; timers.push(setTimeout(loop, 250)); }
  };
  timers.push(setTimeout(loop, 1800));
}

document.getElementById("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
